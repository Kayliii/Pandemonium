# Card:calculate_joker
# Patch Mail-In Rebate to work with Riff-Raff Deck correctly
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''if self.ability.name == 'Mail-In Rebate' and
            not context.other_card.debuff and
            context.other_card:get_id() == G.GAME.current_round.mail_card.id then
                ease_dollars(self.ability.extra)
                return {
                    message = localize('$')..self.ability.extra,
                    colour = G.C.MONEY,
                    card = self
                }
            end'''
position = 'at'
match_indent = true
payload = '''if self.ability.name == 'Mail-In Rebate'
            and not context.other_card.debuff then
              if context.other_card:get_id() == G.GAME.current_round.mail_card.id then
                  ease_dollars(self.ability.extra)
                  return {
                      message = localize('$')..self.ability.extra,
                      colour = G.C.MONEY,
                      card = self
                  }
              end
              local value
              for key, rank in pairs(SMODS.Ranks) do
                if rank.id == G.GAME.current_round.mail_card.id then
                  value = key
                end
              end

              if value and context.other_card.config.center.config['pdem_is_rank_'..value] then
                return {
                  message = localize('$')..self.ability.extra,
                  colour = G.C.MONEY,
                  card = self
                }
              end
            end
            '''

