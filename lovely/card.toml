[manifest]
version = '1.0.0'
dump_lua = true
priority = 1

# Card:set_cost
# Look at whether an antique sticker exists on this joker that should affect the cost.
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = "    self.extra_cost = 0 + G.GAME.inflation"
position = 'after'
match_indent = true
payload = '''
-- Add extra cost to antique cards
if self.ability.pdem_antique then
  self.extra_cost = self.extra_cost + self.base_cost
end
'''


# Card:calculate_joker
# Check for the odds that the card doesn't activate
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''function Card:calculate_joker(context)'''
position = 'after'
match_indent = true
payload = '''
if self.ability.pdem_lazy and not context.pseudorandom_result and not context.fix_probability and not context.mod_probability then
  self.ability.pdem_lazy_prng_index = (self.ability.pdem_lazy_prng_index or 0) + 1
  if (self.ability.pdem_lazy_prng or {0, 0, 1})[(self.ability.pdem_lazy_prng_index % #self.ability.pdem_lazy_prng) + 1] then return nil end
end
'''


# Card:use_consumeable
# Implement a destroyed cards career stat
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = ''' SMODS.calculate_context({ remove_playing_cards = true, removed = destroyed_cards })'''
position = 'after'
match_indent = true
payload = '''
inc_career_stat('pdem_playing_cards_destroyed', #destroyed_cards)
check_for_unlock({ type = 'career_stat', statname = 'pdem_playing_cards_destroyed' })
'''

# Card:calculate_joker
# Do an unlock check for Cavendish destruction
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''if self.ability.name == 'Gros Michel' or self.ability.name == 'Cavendish' then
                    if SMODS.pseudorandom_probability(self, self.ability.name == 'Cavendish' and 'cavendish' or 'gros_michel', 1, self.ability.extra.odds) then '''
position = 'after'
match_indent = true
payload = '''if self.ability.name == 'Cavendish' then
  check_for_unlock({ type = 'pdem_cavendish' })
end'''



# Card:get_chip_mult
# Track the type of lucky card activation
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''if SMODS.pseudorandom_probability(self, 'lucky_mult', 1, 5) then'''
position = 'after'
match_indent = true
payload = '''self.pdem_lucky_mult = true'''

# Card:get_p_dollars
# Track the type of lucky card activation
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''if SMODS.pseudorandom_probability(self, 'lucky_money', 1, 15) then'''
position = 'after'
match_indent = true
payload = '''self.pdem_lucky_money = true'''


# Card:calculate_joker
# Exit early if it's not a joker at all
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''function Card:calculate_joker(context)'''
position = 'after'
match_indent = true
payload = '''
if self.ability.set ~= 'Joker' then return end
'''

# Card:calculate_joker
# Fix Blueprint to work in your hand or in your play area
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''for i = 1, #G.jokers.cards do
                if G.jokers.cards[i] == self then other_joker = G.jokers.cards[i+1] end
            end'''
position = 'after'
match_indent = true
payload = '''
for i = 1, #G.hand.cards do
  if G.hand.cards[i] == self then other_joker = G.hand.cards[i+1] end
end
for i = 1, #G.play.cards do
  if G.play.cards[i] == self then other_joker = G.play.cards[i+1] end
end
'''
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''main_end = (self.area and self.area == G.jokers) and {'''
position = 'at'
match_indent = true
payload = '''main_end = (self.area and (self.area == G.jokers or self.area == G.hand)) and {'''


# Card:update
# Patch Cloud 9 to work with Riff-Raff Deck correctly
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''if v:get_id() == 9 then self.ability.nine_tally = self.ability.nine_tally+1 end'''
position = 'at'
match_indent = true
payload = '''if v:get_id() == 9 or v.base.value == '9' or v.config.center.config.pdem_is_rank_9 then self.ability.nine_tally = self.ability.nine_tally+1 end'''

