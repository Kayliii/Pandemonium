# Card:use_consumeable
# Enhancement consumables don't work normally on joker-suited or joker-ranked playing cards.
# Instead, use custom enhancement markers.
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''G.E_MANAGER:add_event(Event({trigger = 'after',delay = 0.1,func = function() G.hand.highlighted[i]:set_ability(G.P_CENTERS[self.ability.consumeable.mod_conv]);return true end }))'''
position = 'at'
match_indent = true
payload = '''
local card = G.hand.highlighted[i]
if card.base.value == 'pdem_joker_rank' then
  local center = G.P_CENTERS[self.ability.consumeable.mod_conv]
  G.E_MANAGER:add_event(Event({trigger = 'after',delay = 0.1,func = function()
    card.ability.pdem_enhancement = self.ability.consumeable.mod_conv
    card.ability.pdem_enhancement_fake = SMODS.Center.create_fake_card(center)
    card.ability.pdem_enhancement_fake.base = { nominal = 0 }
    card.ability.pdem_enhancement_fake.ability.bonus = card.ability.pdem_enhancement_fake.ability.bonus or 0
    card.ability.pdem_enhancement_fake.ability.p_dollars = card.ability.pdem_enhancement_fake.ability.p_dollars or 0
    card.ability.pdem_enhancement_fake.ability.effect = center.effect
    return true
  end
}))
else
  G.E_MANAGER:add_event(Event({trigger = 'after',delay = 0.1,func = function() card:set_ability(G.P_CENTERS[self.ability.consumeable.mod_conv]);return true end }))
end
'''

