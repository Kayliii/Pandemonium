pattern = '''if context.repetition then'''
position = 'at'
match_indent = true
payload = '''
if context.repetition and ((not context.pdem_joker_only and self.base.value ~= 'pdem_joker_rank') or (context.pdem_joker_only and self.base.value == 'pdem_joker_rank')) then
'''